variables:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_TRUSTED_HOST: mirrors.aliyun.com
  PIP_NO_SSL_VERIFY: "1"
  PYTHONHTTPSVERIFY: "0"
  REQUESTS_CA_BUNDLE: ""
  CURL_CA_BUNDLE: ""
  CMAKE_TLS_VERIFY: 0
  LLVM_PREBUILD_DIR: /home/share/nfs_share/llvm-pre-build
  CI_NODE_COMPILER_ENV_DIR: /home/share/nfs_share/ci-node-compiler-env


include:
  - project: 'ai/gitlab-ci-templates'
    file: 'gitlab-review.yml'
  - project: 'ai/gitlab-ci-templates'
    file: 'x86-host-env.yml'


stages:
  - build
  - test


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes: &lint_paths
        - .gitlab-ci.yml
        - .pre-commit-config.yaml
        - .clang-format
        - CMakePresets.json
        - CMakeLists.txt
        - cmake/**/*
        - scripts/**/*
        - include/**/*
        - lib/**/*
        - python/**/*
        - test/**/*
        - runtime/**/*
        - tools/**/*
        - unittest/**/*
        - backend/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *lint_paths
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "pipeline"


lint:
  stage: .pre
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - 92_13_host
  cache:
    - key:
        files:
          - .pre-commit-config.yaml
      paths:
        - ~/.cache/pre-commit
    - key:
        files:
          - .pre-commit-config.yaml
      paths:
        - ~/.cache/pip
  script:
    - python -m pre_commit run --all-files --show-diff-on-failure --color always


build-spine-mlir:
  extends: .x86-host-ci-env
  stage: build
  needs:
    - job: lint
      optional: true
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_13_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    MAX_JOBS: "16"
  script:
    - |
      set -e
      git submodule update --init --recursive third_party/spine-mlir
      cd third_party/spine-mlir
      rm -rf build/release
      LLVM_COMMIT_ID="$(tr -d '[:space:]' < LLVM_VERSION)"
      LLVM_INSTALL_PATH=${LLVM_PREBUILD_DIR}/llvm-${LLVM_COMMIT_ID}-release-x86
      echo "LLVM_INSTALL_PATH: ${LLVM_INSTALL_PATH}"
      cmake --preset release \
        -DCMAKE_MAKE_PROGRAM="ninja" \
        -DLLVM_INSTALL_PATH="${LLVM_INSTALL_PATH}"
      cmake --build --preset release --target install -j${MAX_JOBS}
      cp "${LLVM_INSTALL_PATH}/bin/llc" build/release/bin/llc
      cp "${LLVM_INSTALL_PATH}/bin/mlir-translate" build/release/bin/mlir-translate
      cp "${LLVM_INSTALL_PATH}/bin/opt" build/release/bin/opt
  artifacts:
    name: spine-mlir-x86-$CI_COMMIT_SHORT_SHA
    paths:
      - third_party/spine-mlir/build/release/
    expire_in: 7 days


build-rpc-runtime:
  extends: .x86-host-ci-env
  stage: build
  needs:
    - job: lint
      optional: true
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_13_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CROSS_TOOLCHAIN_PATH: $DEFAULT_RISCV_ROOT_PATH
  before_script:
    - export GIT_CONFIG_GLOBAL="${CI_PROJECT_DIR}/.job-gitconfig"
    - git config --global http.sslVerify false
    - git config --global url."git@gitlab.dc.com:".insteadOf "https://gitlab.dc.com:8443/"
    - git submodule update --init --recursive third_party/spine-triton-rpc-runtime
    - git submodule update --init --recursive third_party/spine-runtime
  script:
    - |
      set -e
      cd third_party/spine-triton-rpc-runtime
      bash scripts/build_riscv64.sh
      echo "spine-rpc-server built:"
      file build/riscv64/spine-rpc-server

      cd "${CI_PROJECT_DIR}/third_party/spine-runtime"
      RISCV_ROOT_PATH="${CROSS_TOOLCHAIN_PATH}" bash scripts/build.sh riscv64 Release
      echo "spine-runtime installed:"
      ls -la build/riscv64/Release/installed/lib build/riscv64/Release/installed/include

      cd "${CI_PROJECT_DIR}"
      rm -rf ci-artifacts && mkdir -p ci-artifacts
      cp -a third_party/spine-triton-rpc-runtime/build/riscv64 ci-artifacts/rpc-server-riscv64
      cp -a third_party/spine-runtime/build/riscv64/Release/installed ci-artifacts/spine-runtime-install
      echo "staged artifacts:"
      ls -la ci-artifacts/spine-runtime-install/lib ci-artifacts/spine-runtime-install/include
  artifacts:
    name: rpc-runtime-riscv64-$CI_COMMIT_SHORT_SHA
    paths:
      - ci-artifacts/
    expire_in: 7 days


build-x86:
  extends: .x86-host-ci-env
  stage: build
  needs:
    - job: lint
      optional: true
    - job: build-spine-mlir
      artifacts: true
    - job: build-rpc-runtime
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_13_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    MAX_JOBS: "16"
    TRITON_PARALLEL_LINK_JOBS: "2"
  before_script:
    - git submodule update --init --recursive triton
    - python3 -m pip install --quiet --break-system-packages cmake ninja pybind11 setuptools wheel
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      set -e
      export PATH="$HOME/.local/bin:$PATH"

      LLVM_COMMIT_ID="$(tr -d '[:space:]' < LLVM_VERSION)"
      LLVM_DIR=${LLVM_PREBUILD_DIR}/llvm-${LLVM_COMMIT_ID}-20260529-release-x86
      echo "LLVM_DIR: $LLVM_DIR"

      # The build LLVM (675f09ac) ships no MLIR Python bindings; pass the
      # era-matched f6ded0be bindings package (top level contains mlir/) as
      # arg 4 so the build script can vendor them into backend/mlir_core.
      # At runtime no PYTHONPATH is needed (vendored copy is resolved by
      # _mlir_loader.py).
      MLIR_BINDINGS_PKG=${LLVM_PREBUILD_DIR}/llvm-f6ded0be897e2878612dd903f7e8bb85448269e5-20261009-release-x86-python312
      if [ ! -d "$MLIR_BINDINGS_PKG/mlir" ]; then
        echo "ERROR: MLIR python bindings not found in $MLIR_BINDINGS_PKG"
        exit 1
      fi

      SPEIR_DIR="${CI_PROJECT_DIR}/third_party/spine-mlir/build/release"
      if [ ! -d "$SPEIR_DIR" ]; then
        echo "ERROR: spine-mlir artifact not found at ${SPEIR_DIR}"
        exit 1
      fi
      echo "SPEIR_DIR: $SPEIR_DIR"
      chmod -R a+x $SPEIR_DIR/bin/* || true

      SPINE_RUNTIME_DIR="${CI_PROJECT_DIR}/ci-artifacts/spine-runtime-install"
      if [ ! -f "$SPINE_RUNTIME_DIR/include/spert.hpp" ]; then
        echo "ERROR: spine-runtime install not found at ${SPINE_RUNTIME_DIR}"
        exit 1
      fi
      echo "SPINE_RUNTIME_DIR: $SPINE_RUNTIME_DIR"

      chmod +x scripts/build_x86_rpc.sh
      ./scripts/build_x86_rpc.sh $LLVM_DIR $SPEIR_DIR $SPINE_RUNTIME_DIR $MLIR_BINDINGS_PKG

      if [ -d "build-x86_64" ]; then
        echo "X86 build successful"
        DEST=${SHARE_INSTALL_DIR}
        mkdir -p $DEST
        cp -a build-x86_64 $DEST/
        cp -a python/examples $DEST/
        cp -a python/tests $DEST/
        echo "spine-triton build released to $DEST"
      else
        echo "X86 build failed, build-x86_64 directory not found"
        exit 1
      fi
  artifacts:
    name: spine-triton-x86-$CI_COMMIT_SHORT_SHA
    paths:
      - build-x86_64/
    expire_in: 7 days


build-riscv64-whl:
  extends: .x86-host-ci-env
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  tags:
    - 92_13_host
  parallel:
    matrix:
      - PYTHON_VERSION: ["312", "313", "314"]
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "0"
    RISCV_ROOT_PATH: $DEFAULT_RISCV_ROOT_PATH
    ZLIB_LIBDIR: ${CI_NODE_COMPILER_ENV_DIR}/zlib-riscv64/lib
    MAX_JOBS: "16"
    TRITON_PARALLEL_LINK_JOBS: "1"
  before_script:
    - git submodule update --init --recursive triton
  script:
    - |
      set -eo pipefail
      BUILD_LOG="$CI_PROJECT_DIR/build-rv64-whl.log"
      : > "$BUILD_LOG"
      run_build() {
        local build_status
        echo "Build started; full log: $BUILD_LOG"
        if "$@" >> "$BUILD_LOG" 2>&1; then
          echo "Build completed."
        else
          build_status=$?
          echo "Build failed (exit code $build_status). Last 200 lines (up to 64 KiB):"
          tail -n 200 "$BUILD_LOG" | tail -c 65536
          exit "$build_status"
        fi
      }
      if { [ "$CI_PIPELINE_SOURCE" = "web" ] || [ "$CI_PIPELINE_SOURCE" = "api" ]; } && [ -n "${BUILD_COMMIT:-}" ]; then
        git fetch --no-tags origin
        TARGET_COMMIT=$(git rev-parse --verify --end-of-options "${BUILD_COMMIT}^{commit}")
        git checkout --detach "$TARGET_COMMIT"
        git submodule update --init --recursive triton
        echo "Building commit $TARGET_COMMIT" | tee -a "$BUILD_LOG"
      fi

      source .github/variables.env
      ASSET_CACHE="${CI_PROJECT_BUILD_DIR}/asset-cache"
      mkdir -p "${ASSET_CACHE}/tmp" "${SHARE_INSTALL_DIR}"

      fetch_asset() {
        local name="$1" url="$2" md5="$3" marker="$4"
        local dest="${ASSET_CACHE}/${name}-${md5}" lock="${dest}.lock" tmp root waited=0
        if [ -d "$dest" ]; then printf '%s\n' "$dest"; return 0; fi
        until mkdir "$lock" 2>/dev/null; do
          if [ -d "$dest" ]; then printf '%s\n' "$dest"; return 0; fi
          if [ "$waited" -ge 2400 ]; then
            echo "ERROR: timed out waiting for asset lock $lock" >&2
            return 1
          fi
          sleep 20
          waited=$((waited + 20))
        done
        tmp=$(mktemp -d "${ASSET_CACHE}/tmp/${name}.XXXXXX")
        if (
          set -e
          curl -kL --retry 3 --retry-delay 5 -o "$tmp/pkg.bin" "$url"
          echo "$md5  $tmp/pkg.bin" | md5sum -c -
          mkdir -p "$tmp/extract"
          tar -xf "$tmp/pkg.bin" -C "$tmp/extract"
          root=$(dirname "$(find "$tmp/extract" -name "$marker" | head -n 1)")
          test -n "$root" && test -d "$root"
          mkdir -p "$tmp/final"
          cp -a "$root"/. "$tmp/final"/
          if [ -d "$dest" ]; then exit 0; fi
          mv "$tmp/final" "$dest"
        ) >> "$BUILD_LOG" 2>&1; then
          :
        else
          rmdir "$lock" 2>/dev/null || true
          rm -rf "$tmp"
          echo "ERROR: failed to fetch or extract asset ${name}" >&2
          tail -n 50 "$BUILD_LOG"
          return 1
        fi
        rmdir "$lock" 2>/dev/null || true
        rm -rf "$tmp"
        test -d "$dest"
        printf '%s\n' "$dest"
      }

      LLVM_DIR=$(fetch_asset llvm-cross "$LLVM_URL" "$LLVM_MD5" bin)
      SPEIR_DIR=$(fetch_asset speir-riscv64 "$SPEIR_URL" "$SPEIR_MD5" bin)
      SPINE_RUNTIME_DIR=$(fetch_asset spine-runtime-riscv64 "$SPINE_RUNTIME_URL" "$SPINE_RUNTIME_MD5" include)

      PY_FULL="3.${PYTHON_VERSION#3}"
      MLIR_BINDINGS_DIR=${LLVM_PREBUILD_DIR}/llvm-f6ded0be897e2878612dd903f7e8bb85448269e5-20261009-release-riscv64-python${PYTHON_VERSION}
      PY_RISCV_ROOT=${CI_NODE_COMPILER_ENV_DIR}/py-riscv64-${PYTHON_VERSION}
      test -d "${MLIR_BINDINGS_DIR}/mlir"
      test -d "${PY_RISCV_ROOT}/include/python${PY_FULL}"

      python3 -m pip install --quiet --break-system-packages --target "${CI_PROJECT_DIR}/tools-bin" "uv==0.13.5"
      export PATH="${CI_PROJECT_DIR}/tools-bin/bin:$PATH"
      uv venv ".venv-${PYTHON_VERSION}" --python "${PY_FULL}" --seed
      source ".venv-${PYTHON_VERSION}/bin/activate"
      python -m pip install --quiet setuptools wheel cmake ninja pybind11

      run_build bash -e ./scripts/build_whl.sh "$LLVM_DIR" riscv64 "$SPEIR_DIR" "$SPINE_RUNTIME_DIR" "$MLIR_BINDINGS_DIR" "$PY_RISCV_ROOT"

      WHEELS=(build-wheel-riscv64/triton-*cp${PYTHON_VERSION}-cp${PYTHON_VERSION}-linux_riscv64.whl)
      if [ "${#WHEELS[@]}" -ne 1 ] || [ ! -f "${WHEELS[0]}" ]; then
        echo "ERROR: expected exactly one cp${PYTHON_VERSION} linux_riscv64 wheel, got: ${WHEELS[*]:-none}"
        ls -la build-wheel-riscv64/
        exit 1
      fi
      WHEEL="${WHEELS[0]}"

      python - "$WHEEL" <<'PYEOF'
      import struct
      import sys
      import zipfile

      path = sys.argv[1]
      bad = []
      count = 0
      with zipfile.ZipFile(path) as z:
          for name in z.namelist():
              base = name.rsplit("/", 1)[-1]
              if ".so" not in base:
                  continue
              count += 1
              head = z.read(name)[:20]
              if len(head) < 20 or head[:4] != b"\x7fELF":
                  bad.append((name, "not an ELF file"))
                  continue
              if head[4] != 2:
                  bad.append((name, "not ELF64"))
              machine = struct.unpack("<H", head[18:20])[0]
              if machine != 243:
                  bad.append((name, "e_machine=%d, expected 243 (EM_RISCV)" % machine))
      if bad:
          for name, why in bad:
              print("BAD  %s: %s" % (name, why))
          sys.exit(1)
      print("wheel arch check passed: %d shared objects, all ELF64 RISC-V" % count)
      PYEOF

      cp "$WHEEL" "${SHARE_INSTALL_DIR}/"
      echo "wheel published to ${SHARE_INSTALL_DIR}/$(basename "$WHEEL")"
    - |
      set +x
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "${BUILD_COMMIT:-}" ] && [ -n "${GITLAB_PYPI_TOKEN:-}" ] && [ -n "${GITLAB_PYPI_USERNAME:-}" ]; then
        python -m pip install --quiet twine
        TWINE_USERNAME="$GITLAB_PYPI_USERNAME" TWINE_PASSWORD="$GITLAB_PYPI_TOKEN" \
          REQUESTS_CA_BUNDLE=${CI_NODE_COMPILER_ENV_DIR}/gitlab-dc-com-ca.pem \
          python -m twine upload --non-interactive \
          --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" "$WHEEL"
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build-rv64-whl.log


test-spine-triton-integration:
  extends: .x86-host-ci-env
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  needs:
    - job: build-x86
      artifacts: false
    - job: build-rpc-runtime
      artifacts: true
  tags:
    - 92_13_host
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CROSS_TOOLCHAIN_PATH: $DEFAULT_RISCV_ROOT_PATH
    QEMU_PATH: $DEFAULT_RISCV_QEMU_PATH/bin/qemu-riscv64
    QEMU_SYSROOT: ${CI_NODE_COMPILER_ENV_DIR}/spacemit-toolchain-linux-glibc-x86_64-v1.2.4/sysroot
    RPC_PORT: "9999"
  script:
    - |
      set -e

      ST_BASE=${CI_PROJECT_BUILD_DIR}
      ST_DIR=$(for d in $(ls -d ${ST_BASE}/[0-9]* 2>/dev/null | sort -t/ -k8 -n -r); do
                 [ -d "$d/build-x86_64" ] && echo "$d" && break
               done)
      if [ -z "$ST_DIR" ]; then
        echo "ERROR: no spine-triton build (with build-x86_64/) found in ${ST_BASE}"
        exit 1
      fi
      echo "spine-triton build dir: $ST_DIR"

      RPC_DIR="${CI_PROJECT_DIR}/ci-artifacts/rpc-server-riscv64"
      if [ ! -f "$RPC_DIR/spine-rpc-server" ]; then
        echo "ERROR: spine-rpc-server not found at ${RPC_DIR}/spine-rpc-server"
        exit 1
      fi
      echo "rpc-runtime build dir: $RPC_DIR"

      source /home/gitlab-runner/.triton/bin/activate

      export PYTHONPATH=$ST_DIR/build-x86_64:$PYTHONPATH
      export SPINE_TRITON_CROSS_TOOLCHAIN=$CROSS_TOOLCHAIN_PATH
      export SPINE_TRITON_TARGET_ARCH=riscv64
      export SPACEMIT_EP_QEMU_SET_CORE_ARCH="0xA064"
      export SPINE_TRITON_RPC_HOST=localhost
      export SPINE_TRITON_RPC_PORT=$RPC_PORT
      export SPINE_TRITON_DUMP_PATH=$CI_PROJECT_DIR/rpc_ir_dump
      export GEMS_VENDOR=spacemit
      mkdir -p $SPINE_TRITON_DUMP_PATH

      pkill -f "spine-rpc-server $RPC_PORT" 2>/dev/null || true
      for i in $(seq 1 10); do
        python3 -c "import socket,sys; s=socket.socket(); sys.exit(1 if s.connect_ex(('localhost', $RPC_PORT))==0 else 0)" && break
        echo "waiting for stale server on port $RPC_PORT to exit..."
        sleep 1
      done

      "$QEMU_PATH" \
        -L "$QEMU_SYSROOT" \
        -cpu max,vlen=1024,elen=64,vext_spec=v1.0\
        "$RPC_DIR/spine-rpc-server" "$RPC_PORT" > rpc_server.log 2>&1 &
      echo $! > .rpc_server.pid

      SERVER_PID=$(cat .rpc_server.pid)
      for i in $(seq 1 30); do
        if ! kill -0 "$SERVER_PID" 2>/dev/null; then
          echo "RPC server process died, log:"; cat rpc_server.log; exit 1
        fi
        if python3 -c "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex(('localhost', $RPC_PORT))==0 else 1)"; then
          echo "RPC server is ready"; break
        fi
        if [ "$i" = "30" ]; then echo "RPC server failed to start"; cat rpc_server.log; exit 1; fi
        sleep 1
      done

      python3 $ST_DIR/examples/mm_block_ptr.py
      PYTHONUNBUFFERED=1 pytest -sv -p no:cacheprovider \
        $ST_DIR/tests/raw/test_raw_mv_svector.py \
        $ST_DIR/tests/raw/test_raw_mv_three_stage.py

      rm -rf "$CI_PROJECT_DIR/flaggems"
      git clone --depth=1 -b spacemit-ops-v2.2 https://gitlab.dc.com:8443/ai/AICompiler/spine-flaggems.git "$CI_PROJECT_DIR/flaggems"
      export PYTHONPATH=$CI_PROJECT_DIR/flaggems/src:$PYTHONPATH
      mkdir -p "$CI_PROJECT_DIR/flaggems/logs"
      cd "$CI_PROJECT_DIR/flaggems"
      PYTHONUNBUFFERED=1 timeout 1200 stdbuf -oL -eL \
        pytest -sv tests/test_unary_pointwise_ops.py -m gelu
  after_script:
    - '[ -f rpc_server.log ] && echo "=== RPC server log ===" && cat rpc_server.log || true'
    - |
      if [ -f .rpc_server.pid ]; then
        SERVER_PID=$(cat .rpc_server.pid)
        kill "$SERVER_PID" 2>/dev/null || true
        rm -f .rpc_server.pid
      fi
      pkill -f "spine-rpc-server $RPC_PORT" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - flaggems/logs/
      - rpc_server.log
    expire_in: 7 days
